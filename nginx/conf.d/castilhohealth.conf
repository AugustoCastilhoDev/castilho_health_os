# HTTP-only bootstrap config. Certbot's HTTP-01 challenge needs a plain :80
# server to answer BEFORE any certificate exists, so this can't already
# require TLS. Once `certbot certonly` has issued the first certificate,
# enable 001-ssl.conf.disabled (see nginx/README notes in the deploy step)
# to get the real HTTPS server block and the redirect below.
server {
    listen 80;
    listen [::]:80;
    server_name castilhohealth.com.br www.castilhohealth.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
