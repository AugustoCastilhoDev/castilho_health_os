name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chos_user
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: castilho_health
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chos_user -d castilho_health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_USER: chos_user
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: castilho_health
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_SSLMODE: disable
      # CI-only: never used outside this ephemeral runner.
      JWT_SECRET: ci-only-dummy-secret-at-least-32-characters-long
      JWT_TTL: 24h

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify gofmt
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'ed:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Install golang-migrate
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1

      - name: Run migrations
        run: |
          migrate -path migrations \
            -database "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB}?sslmode=disable" \
            up

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -v -count=1

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t chos-app-ci-check .
