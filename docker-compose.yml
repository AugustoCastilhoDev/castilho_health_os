services:
  db:
    image: postgres:16-alpine
    container_name: chos_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Bound to localhost only — on the VPS the app talks to db over the
    # internal compose network, this is just for local psql/DBeaver access.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: chos_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  # One-shot: applies pending migrations and exits. Re-run with
  # `docker compose run --rm migrate` after adding new migration files.
  migrate:
    image: migrate/migrate:v4.19.1
    container_name: chos_migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
      - "up"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chos_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      APP_PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # nginx/certbot only run under the "production" profile (`docker compose
  # --profile production up`) — plain `docker compose up` for local dev
  # skips them, so ports 80/443 never fight with anything else on the
  # host and stay untouched when there's no real domain to serve.
  nginx:
    image: nginx:1.27-alpine
    container_name: chos_nginx
    restart: unless-stopped
    profiles: ["production"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - app

  # See nginx/conf.d/001-ssl.conf.disabled for the one-time issuance
  # command and the renewal/reload notes.
  certbot:
    image: certbot/certbot
    container_name: chos_certbot
    profiles: ["production"]
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;"

volumes:
  db_data:
  redis_data:
  certbot_www:
  certbot_certs:
